services:
  db-database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-habit_tracker}
      POSTGRES_USER: ${DB_USERNAME:-laravel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - '${DB_PORT:-5433}:5432'
    volumes:
      - dbdatamigrate:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 5
  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: ${DB_PORT:-5433}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      # Chave do Firebase: fica no servidor, fora da imagem, e só para leitura.
      - ./storage/app/private/firebase:/var/www/html/storage/app/private/firebase:ro
    ports:
      - '${APP_PORT:-8080}:80'
    depends_on:
      db-database:
        condition: service_healthy
  # Dispara as tarefas periódicas de routes/console.php (notificações, pool semanal):
  # mesma imagem da API, rodando o scheduler do Laravel em vez do nginx.
  scheduler:
    build: .
    command: ['php', 'artisan', 'schedule:work']
    restart: unless-stopped
    volumes:
      # Chave do Firebase: fica no servidor, fora da imagem, e só para leitura.
      - ./storage/app/private/firebase:/var/www/html/storage/app/private/firebase:ro
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: ${DB_PORT:-5433}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      db-database:
        condition: service_healthy
volumes:
  dbdatamigrate:
    driver: local