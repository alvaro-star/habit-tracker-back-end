services:
  db-database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-habit_tracker}
      POSTGRES_USER: ${DB_USERNAME:-laravel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - '${DB_PORT:-5433}:5432'
    volumes:
      - dbdatamigrate:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 5
  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: ${DB_PORT:-5433}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${APP_PORT:-8080}:80'
    depends_on:
      db-database:
        condition: service_healthy
volumes:
  dbdatamigrate:
    driver: local